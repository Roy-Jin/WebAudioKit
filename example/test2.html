<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MusicPlayer Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f13;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      gap: 20px;
    }

    h1 { font-size: 1.3rem; font-weight: 600; color: #fff; letter-spacing: 0.05em; }

    /* Loading overlay */
    .loading-overlay {
      position: fixed; inset: 0;
      background: #0f0f13;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      z-index: 100; font-size: 0.88rem; color: #888;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #2a2a36; border-top-color: #6366f1;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Player Card */
    .player-card {
      width: 100%; max-width: 560px;
      background: #1a1a22; border: 1px solid #2a2a36;
      border-radius: 16px; overflow: hidden;
    }

    /* Cover area */
    .cover-wrap {
      position: relative;
      width: 100%; aspect-ratio: 1;
      background: #111118;
      display: flex; align-items: center; justify-content: center;
    }
    .cover-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      transition: opacity 0.4s;
    }
    .cover-wrap img.hidden { opacity: 0; }

    /* Status badge */
    .state-badge {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
      border-radius: 20px; padding: 4px 12px;
      font-size: 0.75rem; color: #ccc;
      display: flex; align-items: center; gap: 6px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #555;
      transition: background 0.2s;
    }
    .dot.playing  { background: #4ade80; box-shadow: 0 0 5px #4ade80; }
    .dot.paused   { background: #facc15; }
    .dot.loading  { background: #60a5fa; animation: pulse 1s infinite; }
    .dot.stopped  { background: #555; }
    .dot.error    { background: #ef4444; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* Info area */
    .info-wrap {
      padding: 20px 24px 0;
      display: flex; flex-direction: column; gap: 4px;
    }
    .track-title {
      font-size: 1.05rem; font-weight: 600; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 0.82rem; color: #888;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Lyrics */
    .lyric-line {
      min-height: 22px; padding: 8px 24px 0;
      font-size: 0.82rem; color: #6366f1;
      text-align: center; font-style: italic;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: opacity 0.3s;
    }

    /* Progress bar */
    .progress-wrap {
      padding: 12px 24px 0;
      display: flex; align-items: center; gap: 10px;
      font-size: 0.72rem; color: #666;
    }
    .progress-track {
      flex: 1; height: 4px; background: #2a2a36;
      border-radius: 2px; cursor: pointer; position: relative;
    }
    .progress-fill {
      height: 100%; background: #6366f1; border-radius: 2px;
      width: 0%; pointer-events: none;
      transition: width 0.25s linear;
    }

    /* Volume */
    .volume-row {
      padding: 10px 24px 0;
      display: flex; align-items: center; gap: 10px;
      font-size: 0.78rem; color: #666;
    }
    input[type=range] { flex: 1; accent-color: #6366f1; cursor: pointer; }
    .vol-label { min-width: 36px; text-align: right; color: #aaa; }

    /* Control buttons */
    .controls {
      padding: 16px 24px 20px;
      display: flex; align-items: center; justify-content: center; gap: 12px;
    }
    .btn {
      background: #22222e; border: 1px solid #2a2a36;
      color: #ccc; border-radius: 8px; cursor: pointer;
      font-size: 0.82rem; padding: 9px 18px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn:hover  { background: #2e2e3e; color: #fff; border-color: #444; }
    .btn:active { background: #6366f1; color: #fff; border-color: #6366f1; }
    .btn.icon   { padding: 9px 14px; font-size: 1rem; }
    .btn.primary { background: #6366f1; color: #fff; border-color: #6366f1; }
    .btn.primary:hover { background: #4f52d4; }

    /* Play mode */
    .mode-row {
      padding: 0 24px 16px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .mode-btn {
      padding: 5px 12px; border-radius: 20px;
      border: 1px solid #2a2a36; background: #22222e;
      color: #888; font-size: 0.75rem; cursor: pointer;
      transition: all 0.15s;
    }
    .mode-btn.active { background: #6366f1; color: #fff; border-color: #6366f1; }

    /* Playlist */
    .playlist-card {
      width: 100%; max-width: 560px;
      background: #1a1a22; border: 1px solid #2a2a36;
      border-radius: 12px; overflow: hidden;
    }
    .playlist-header {
      padding: 14px 20px;
      font-size: 0.8rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em; color: #666;
      border-bottom: 1px solid #2a2a36;
    }
    .playlist-body { max-height: 320px; overflow-y: auto; }
    .playlist-body::-webkit-scrollbar { width: 4px; }
    .playlist-body::-webkit-scrollbar-track { background: transparent; }
    .playlist-body::-webkit-scrollbar-thumb { background: #2a2a36; border-radius: 2px; }

    .playlist-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 20px; cursor: pointer;
      transition: background 0.12s; border-bottom: 1px solid #1e1e28;
    }
    .playlist-item:last-child { border-bottom: none; }
    .playlist-item:hover { background: #22222e; }
    .playlist-item.active { background: #1e1e30; }

    .item-index {
      min-width: 24px; text-align: center;
      font-size: 0.75rem; color: #555;
    }
    .playlist-item.active .item-index { color: #6366f1; }

    .item-info { flex: 1; overflow: hidden; }
    .item-title {
      font-size: 0.85rem; color: #ddd;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .playlist-item.active .item-title { color: #6366f1; }
    .item-artist { font-size: 0.75rem; color: #666; }

    .item-dur { font-size: 0.72rem; color: #555; }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <span id="loading-text">Loading playlist...</span>
  </div>

  <h1>MusicPlayer Test</h1>

  <!-- Player Card -->
  <div class="player-card">
    <div class="cover-wrap">
      <img id="cover" src="" alt="cover" class="hidden" />
      <div class="state-badge">
        <div class="dot stopped" id="state-dot"></div>
        <span id="state-text">Not Playing</span>
      </div>
    </div>

    <div class="info-wrap">
      <div class="track-title" id="track-title">—</div>
      <div class="track-artist" id="track-artist">—</div>
    </div>

    <div class="lyric-line" id="lyric-line"></div>

    <div class="progress-wrap">
      <span id="cur-time">0:00</span>
      <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <div class="volume-row">
      <span>🔈</span>
      <input type="range" min="0" max="100" value="80" id="vol-slider" />
      <span class="vol-label" id="vol-label">80%</span>
    </div>

    <div class="controls">
      <button class="btn icon" id="btn-prev" title="Previous">⏮</button>
      <button class="btn icon primary" id="btn-play" title="Play/Pause">▶</button>
      <button class="btn icon" id="btn-next" title="Next">⏭</button>
      <button class="btn icon" id="btn-stop" title="Stop">⏹</button>
    </div>

    <div class="mode-row">
      <button class="mode-btn" data-mode="sequential">Sequential</button>
      <button class="mode-btn" data-mode="loop">Loop Playlist</button>
      <button class="mode-btn" data-mode="single">Single Loop</button>
      <button class="mode-btn active" data-mode="shuffle">Shuffle</button>
    </div>
  </div>

  <!-- Playlist -->
  <div class="playlist-card">
    <div class="playlist-header">Playlist · <span id="playlist-count">0</span> tracks</div>
    <div class="playlist-body" id="playlist-body"></div>
  </div>

  <script type="module">
    import { MusicPlayer, PlayMode } from 'https://unpkg.com/webaudiokit/dist/index.js';

    const METING_API = 'https://api.qijieya.cn/meting/';

    // ── Utilities ──────────────────────────────────────
    const $ = id => document.getElementById(id);
    const fmt = s => {
      if (!s || isNaN(s) || !isFinite(s)) return '0:00';
      const m = Math.floor(s / 60), sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    };

    // ── Initialize Player ──────────────────────────────
    const player = new MusicPlayer({
      volume: 0.8,
      fade: true,
      stopOnHidden: false,
      mode: PlayMode.SHUFFLE
    });
    window.player = player;

    // ── Load Playlist ──────────────────────────────────
    $('loading-text').textContent = 'Loading playlist...';
    let metingData;
    try {
      const res = await fetch(`${METING_API}?server=netease&type=playlist&id=14110835110`);
      metingData = await res.json();
    } catch (e) {
      $('loading-text').textContent = 'Failed to load, check network';
      throw e;
    }

    player.addFromMeting(metingData);
    $('loading').style.display = 'none';

    // ── Render Playlist ────────────────────────────────
    function renderPlaylist() {
      const all = player.getAll();
      $('playlist-count').textContent = all.length;
      const body = $('playlist-body');
      body.innerHTML = '';
      all.forEach((music, i) => {
        const meta = music.meta;
        const item = document.createElement('div');
        item.className = 'playlist-item' + (i === player.currentIndex ? ' active' : '');
        item.dataset.idx = i;
        item.innerHTML = `
          <div class="item-index">${i + 1}</div>
          <div class="item-info">
            <div class="item-title">${meta.title ?? 'Unknown Track'}</div>
            <div class="item-artist">${meta.artist ?? 'Unknown Artist'}</div>
          </div>
          <div class="item-dur">${fmt(meta.duration)}</div>
        `;
        item.addEventListener('click', () => player.play(i));
        body.appendChild(item);
      });
    }

    function updateActiveItem() {
      document.querySelectorAll('.playlist-item').forEach((el, i) => {
        el.classList.toggle('active', i === player.currentIndex);
      });
      // Scroll to current item
      const active = $('playlist-body').querySelector('.playlist-item.active');
      active?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    renderPlaylist();

    // ── State Updates ──────────────────────────────────
    const syncPlayBtn = () => { $('btn-play').textContent = player.paused ? '▶' : '⏸'; };

    function setStateDot(state) {
      $('state-dot').className = `dot ${state}`;
      const labels = { playing: 'Playing', paused: 'Paused', stopped: 'Not Playing', loading: 'Loading', error: 'Error' };
      $('state-text').textContent = labels[state] ?? state;
      syncPlayBtn();
    }

    function updateMeta(music) {
      if (!music) return;
      const meta = music.meta;
      const title  = meta.title  ?? 'Unknown Track';
      const artist = meta.artist ?? 'Unknown Artist';
      $('track-title').textContent  = title;
      $('track-artist').textContent = artist;
      document.title = `${title} - ${artist}`;

      const img = $('cover');
      if (meta.cover) {
        img.classList.add('hidden');
        img.onload = () => img.classList.remove('hidden');
        img.src = meta.cover;
      }
    }

    // ── Event Listeners ────────────────────────────────
    player.on('play',    () => setStateDot('playing'));
    player.on('pause',   () => setStateDot('paused'));
    player.on('stop',    () => { setStateDot('stopped'); $('lyric-line').textContent = ''; document.title = 'MusicPlayer Test'; });
    player.on('ended',   () => setStateDot('stopped'));

    player.on('musicchange', music => {
      setStateDot('loading');
      updateMeta(music);
      updateActiveItem();
      $('lyric-line').textContent = '';
      $('progress-fill').style.width = '0%';
      $('cur-time').textContent = '0:00';
    });

    player.on('timeupdate', ({ currentTime, duration }) => {
      $('cur-time').textContent = fmt(currentTime);
      $('progress-fill').style.width = duration > 0 ? `${(currentTime / duration) * 100}%` : '0%';
    });

    player.on('lyricchange', lyric => {
      $('lyric-line').textContent = lyric?.text ?? '';
    });

    player.on('volumechange', v => {
      const pct = Math.round(v * 100);
      $('vol-slider').value = pct;
      $('vol-label').textContent = `${pct}%`;
    });

    player.on('error', e => {
      // setStateDot('error');
      // console.error('Player error:', e);
    });

    // ── Control Buttons ────────────────────────────────
    $('btn-play').addEventListener('click', () => {
      if (player.paused) player.play();
      else player.pause();
    });

    $('btn-prev').addEventListener('click', () => player.playPrev());
    $('btn-next').addEventListener('click', () => player.playNext());
    $('btn-stop').addEventListener('click', () => player.stop());

    // ── Progress bar click ─────────────────────────────
    $('progress-track').addEventListener('click', e => {
      if (!player.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      player.currentTime = ((e.clientX - rect.left) / rect.width) * player.duration;
    });

    // ── Volume slider ──────────────────────────────────
    $('vol-slider').addEventListener('input', e => {
      player.volume = e.target.value / 100;
      $('vol-label').textContent = `${e.target.value}%`;
    });

    // ── Play mode ─────────────────────────────────────
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        player.playMode = btn.dataset.mode;
      });
    });
  </script>
</body>
</html>
