<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebAudioKit Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f13;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 24px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.05em;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background: #1a1a22;
      border: 1px solid #2a2a36;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
    }

    /* 状态指示器 */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #111118;
      border-radius: 8px;
      font-size: 0.82rem;
      min-height: 40px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .dot.playing  { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
    .dot.paused   { background: #facc15; box-shadow: 0 0 6px #facc15; }
    .dot.stopped  { background: #555; }
    .dot.active   { background: #60a5fa; box-shadow: 0 0 6px #60a5fa; }

    .status-text { flex: 1; color: #ccc; }

    /* 进度条 */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      color: #666;
    }

    .progress-track {
      flex: 1;
      height: 4px;
      background: #2a2a36;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: #6366f1;
      border-radius: 2px;
      width: 0%;
      transition: width 0.25s linear;
      pointer-events: none;
    }

    /* 音量滑块 */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: #888;
    }

    input[type=range] {
      flex: 1;
      accent-color: #6366f1;
      cursor: pointer;
    }

    .vol-label { min-width: 36px; text-align: right; color: #ccc; }

    /* 按钮组 */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      padding: 8px 16px;
      border: 1px solid #2a2a36;
      border-radius: 6px;
      background: #22222e;
      color: #ccc;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    button:hover  { background: #2e2e3e; color: #fff; border-color: #444; }
    button:active { background: #6366f1; color: #fff; border-color: #6366f1; }
    button.active { background: #6366f1; color: #fff; border-color: #6366f1; }
    button.danger { border-color: #ef4444; color: #ef4444; }
    button.danger:hover { background: #ef4444; color: #fff; }

    /* SFX 活跃计数徽章 */
    .badge {
      display: inline-block;
      background: #6366f1;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 10px;
      padding: 1px 7px;
      margin-left: 4px;
      min-width: 20px;
      text-align: center;
    }

    /* 加载状态 */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #0f0f13;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
      font-size: 0.9rem;
      color: #888;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #2a2a36;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <span id="loading-text">正在加载音频资源...</span>
  </div>

  <h1>WebAudioKit Test</h1>

  <!-- BGM -->
  <div class="card">
    <div class="card-title">BGM · 背景音乐</div>

    <div class="status-bar">
      <div class="dot stopped" id="bgm-dot"></div>
      <span class="status-text" id="bgm-status">未播放</span>
      <span id="bgm-track" style="color:#666;font-size:0.78rem;">—</span>
    </div>

    <div class="progress-wrap">
      <span id="bgm-cur">0:00</span>
      <div class="progress-track" id="bgm-progress-track">
        <div class="progress-fill" id="bgm-progress"></div>
      </div>
      <span id="bgm-dur">0:00</span>
    </div>

    <div class="volume-row">
      <span>音量</span>
      <input type="range" min="0" max="100" value="60" id="bgm-vol-slider" />
      <span class="vol-label" id="bgm-vol-label">60%</span>
    </div>

    <div class="btn-row">
      <button id="btn-bgm1">▶ BGM 1</button>
      <button id="btn-bgm2">▶ BGM 2</button>
      <button id="btn-bgm-pause">⏸ 暂停</button>
      <button id="btn-bgm-resume">▶ 恢复</button>
      <button id="btn-bgm-stop" class="danger">⏹ 停止</button>
    </div>
  </div>

  <!-- SFX -->
  <div class="card">
    <div class="card-title">SFX · 音效</div>

    <div class="status-bar">
      <div class="dot stopped" id="sfx-dot"></div>
      <span class="status-text" id="sfx-status">待机</span>
      <span id="sfx-badge-wrap" style="font-size:0.78rem;color:#666;">活跃实例 <span class="badge" id="sfx-count">0</span></span>
    </div>

    <div class="volume-row">
      <span>音量</span>
      <input type="range" min="0" max="100" value="70" id="sfx-vol-slider" />
      <span class="vol-label" id="sfx-vol-label">70%</span>
    </div>

    <div class="btn-row">
      <button id="btn-sfx1">🔊 音效 1</button>
      <button id="btn-sfx2">🔊 音效 2</button>
      <button id="btn-sfx3">🔊 音效 3</button>
      <button id="btn-sfx-rapid">⚡ 连发×5</button>
      <button id="btn-sfx-stop" class="danger">⏹ 全部停止</button>
    </div>
  </div>

  <script type="module">
    import { BGM, SFX } from '../dist/index.js';

    // ── 工具函数 ──────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const fmt = s => {
      if (!s || isNaN(s)) return '0:00';
      const m = Math.floor(s / 60), sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    };

    // ── BGM 初始化 ────────────────────────────────────────
    const bgm = new BGM({ volume: 0.6, loop: true, fadeIn: 800, fadeOut: 600, stopOnHidden: true });

    // ── SFX 初始化 ────────────────────────────────────────
    const sfx = new SFX({ volume: 0.7, stopOnHidden: true });

    // ── 加载资源 ──────────────────────────────────────────
    $('loading-text').textContent = '正在加载音频资源...';
    await Promise.all([
      bgm.load('bgm1', 'assets/bgm_1.mp3'),
      bgm.load('bgm2', 'assets/bgm_2.mp3'),
      sfx.load('sfx1', 'assets/sfx_1.mp3'),
      sfx.load('sfx2', 'assets/sfx_2.mp3'),
      sfx.load('sfx3', 'assets/sfx_3.mp3'),
    ]);
    $('loading').style.display = 'none';

    // ── BGM 状态更新 ──────────────────────────────────────
    let bgmState = 'stopped'; // playing | paused | stopped

    function setBgmState(state, trackName) {
      bgmState = state;
      const dot = $('bgm-dot');
      dot.className = `dot ${state}`;
      const labels = { playing: '播放中', paused: '已暂停', stopped: '未播放' };
      $('bgm-status').textContent = labels[state] ?? state;
      if (trackName !== undefined) $('bgm-track').textContent = trackName || '—';
    }

    function updateBgmProgress() {
      if (bgmState !== 'playing') return;
      const cur = bgm.currentTime, dur = bgm.duration;
      $('bgm-cur').textContent = fmt(cur);
      $('bgm-dur').textContent = fmt(dur);
      $('bgm-progress').style.width = dur > 0 ? `${(cur / dur) * 100}%` : '0%';
    }

    setInterval(updateBgmProgress, 250);

    bgm.on('play',  () => setBgmState('playing'));
    bgm.on('pause', () => setBgmState('paused'));
    bgm.on('stop',  () => { setBgmState('stopped', '—'); $('bgm-progress').style.width = '0%'; $('bgm-cur').textContent = '0:00'; });
    bgm.on('ended', () => setBgmState('stopped'));

    // ── BGM 音量滑块 ──────────────────────────────────────
    $('bgm-vol-slider').addEventListener('input', e => {
      const v = e.target.value / 100;
      bgm.volume = v;
      $('bgm-vol-label').textContent = `${e.target.value}%`;
    });

    bgm.on('volumechange', v => {
      const pct = Math.round(v * 100);
      $('bgm-vol-slider').value = pct;
      $('bgm-vol-label').textContent = `${pct}%`;
    });

    // ── BGM 进度条点击跳转 ────────────────────────────────
    $('bgm-progress-track').addEventListener('click', e => {
      if (!bgm.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      bgm.currentTime = ((e.clientX - rect.left) / rect.width) * bgm.duration;
    });

    // ── BGM 按钮 ──────────────────────────────────────────
    $('btn-bgm1').addEventListener('click', async () => {
      await bgm.play('bgm1');
      setBgmState('playing', 'BGM 1');
    });

    $('btn-bgm2').addEventListener('click', async () => {
      await bgm.play('bgm2');
      setBgmState('playing', 'BGM 2');
    });

    $('btn-bgm-pause').addEventListener('click', () => bgm.pause());
    $('btn-bgm-resume').addEventListener('click', () => bgm.resume());
    $('btn-bgm-stop').addEventListener('click', () => bgm.stop());

    // ── SFX 活跃计数实时刷新 ──────────────────────────────
    function updateSfxCount() {
      const n = sfx.activeCount;
      $('sfx-count').textContent = n;
      const dot = $('sfx-dot');
      if (n > 0) {
        dot.className = 'dot active';
        $('sfx-status').textContent = `${n} 个实例播放中`;
      } else {
        dot.className = 'dot stopped';
        $('sfx-status').textContent = '待机';
      }
    }

    setInterval(updateSfxCount, 100);

    // ── SFX 音量滑块 ──────────────────────────────────────
    let sfxVolume = 0.7;
    $('sfx-vol-slider').addEventListener('input', e => {
      sfxVolume = e.target.value / 100;
      $('sfx-vol-label').textContent = `${e.target.value}%`;
    });

    // ── SFX 按钮 ──────────────────────────────────────────
    $('btn-sfx1').addEventListener('click', () => sfx.play('sfx1', { volume: sfxVolume }));
    $('btn-sfx2').addEventListener('click', () => sfx.play('sfx2', { volume: sfxVolume }));
    $('btn-sfx3').addEventListener('click', () => sfx.play('sfx3', { volume: sfxVolume }));

    $('btn-sfx-rapid').addEventListener('click', () => {
      let i = 0;
      const t = setInterval(() => {
        sfx.play('sfx1', { volume: sfxVolume });
        if (++i >= 5) clearInterval(t);
      }, 180);
    });

    $('btn-sfx-stop').addEventListener('click', () => sfx.stopAll());
  </script>
</body>
</html>
