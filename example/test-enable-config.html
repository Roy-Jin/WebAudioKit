<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enable & Config Test - WebAudioKit</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    button {
      margin: 5px;
      padding: 10px 15px;
      cursor: pointer;
    }
    .status {
      margin: 10px 0;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h1>Enable & Config 功能测试</h1>

  <div class="section">
    <h2>BGM 测试</h2>
    <button onclick="loadBGM()">加载 BGM</button>
    <button onclick="playBGM()">播放</button>
    <button onclick="pauseBGM()">暂停</button>
    <button onclick="toggleBGMEnable()">切换启用状态</button>
    <button onclick="updateBGMConfig()">更新配置</button>
    <div class="status" id="bgm-status">BGM 状态: 未初始化</div>
  </div>

  <div class="section">
    <h2>SFX 测试</h2>
    <button onclick="loadSFX()">加载 SFX</button>
    <button onclick="playSFX()">播放音效</button>
    <button onclick="toggleSFXEnable()">切换启用状态</button>
    <button onclick="updateSFXConfig()">更新配置</button>
    <div class="status" id="sfx-status">SFX 状态: 未初始化</div>
  </div>

  <div class="section">
    <h2>MusicPlayer 测试</h2>
    <button onclick="loadPlayer()">加载播放列表</button>
    <button onclick="playPlayer()">播放</button>
    <button onclick="pausePlayer()">暂停</button>
    <button onclick="togglePlayerEnable()">切换启用状态</button>
    <button onclick="updatePlayerConfig()">更新配置</button>
    <div class="status" id="player-status">Player 状态: 未初始化</div>
  </div>

  <script type="module">
    import { BGM, SFX, MusicPlayer, Music, PlayMode } from '../dist/index.js';

    // 全局变量
    window.bgm = null;
    window.sfx = null;
    window.player = null;

    // BGM 函数
    window.loadBGM = async function() {
      if (!window.bgm) {
        window.bgm = new BGM({ volume: 0.5, loop: true, enable: true });
      }
      await window.bgm.load('bgm1', 'assets/bgm_1.mp3');
      updateStatus('bgm', `已加载, enable: ${window.bgm.enable}`);
    };

    window.playBGM = async function() {
      if (!window.bgm) return;
      await window.bgm.play('bgm1');
      updateStatus('bgm', `播放中, enable: ${window.bgm.enable}`);
    };

    window.pauseBGM = function() {
      if (!window.bgm) return;
      window.bgm.pause();
      updateStatus('bgm', `已暂停, enable: ${window.bgm.enable}`);
    };

    window.toggleBGMEnable = function() {
      if (!window.bgm) return;
      window.bgm.enable = !window.bgm.enable;
      updateStatus('bgm', `enable: ${window.bgm.enable}`);
    };

    window.updateBGMConfig = function() {
      if (!window.bgm) return;
      window.bgm.config = { volume: 0.8, fadeIn: 1000, fadeOut: 1000 };
      const config = window.bgm.config;
      updateStatus('bgm', `配置已更新: volume=${config.volume}, fadeIn=${config.fadeIn}`);
    };

    // SFX 函数
    window.loadSFX = async function() {
      if (!window.sfx) {
        window.sfx = new SFX({ volume: 0.7, enable: true });
      }
      await window.sfx.load('sfx1', 'assets/sfx_1.mp3');
      updateStatus('sfx', `已加载, enable: ${window.sfx.enable}`);
    };

    window.playSFX = async function() {
      if (!window.sfx) return;
      await window.sfx.play('sfx1');
      updateStatus('sfx', `播放音效, enable: ${window.sfx.enable}`);
    };

    window.toggleSFXEnable = function() {
      if (!window.sfx) return;
      window.sfx.enable = !window.sfx.enable;
      updateStatus('sfx', `enable: ${window.sfx.enable}`);
    };

    window.updateSFXConfig = function() {
      if (!window.sfx) return;
      window.sfx.config = { volume: 0.9, rate: 1.2 };
      const config = window.sfx.config;
      updateStatus('sfx', `配置已更新: volume=${config.volume}, rate=${config.rate}`);
    };

    // MusicPlayer 函数
    window.loadPlayer = function() {
      if (!window.player) {
        window.player = new MusicPlayer({ 
          volume: 0.6, 
          mode: PlayMode.SEQUENTIAL,
          enable: true 
        });
      }
      const music1 = new Music('assets/bgm_1.mp3', { title: '音乐1', artist: '艺术家1' });
      const music2 = new Music('assets/bgm_2.mp3', { title: '音乐2', artist: '艺术家2' });
      window.player.addList([music1, music2]);
      updateStatus('player', `已加载 ${window.player.length} 首歌曲, enable: ${window.player.enable}`);
    };

    window.playPlayer = async function() {
      if (!window.player) return;
      await window.player.play();
      updateStatus('player', `播放中, enable: ${window.player.enable}`);
    };

    window.pausePlayer = function() {
      if (!window.player) return;
      window.player.pause();
      updateStatus('player', `已暂停, enable: ${window.player.enable}`);
    };

    window.togglePlayerEnable = function() {
      if (!window.player) return;
      window.player.enable = !window.player.enable;
      updateStatus('player', `enable: ${window.player.enable}`);
    };

    window.updatePlayerConfig = function() {
      if (!window.player) return;
      window.player.config = { 
        volume: 0.8, 
        mode: PlayMode.SHUFFLE,
        fadeIn: 500,
        fadeOut: 500
      };
      const config = window.player.config;
      updateStatus('player', `配置已更新: volume=${config.volume}, mode=${config.mode}`);
    };

    // 辅助函数
    function updateStatus(type, message) {
      document.getElementById(`${type}-status`).textContent = `${type.toUpperCase()} 状态: ${message}`;
    }
  </script>
</body>
</html>
